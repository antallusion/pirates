<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title data-i18n="doc.title">GRAVETIDE — a Pirate Gothic MMORPG</title>
  <!-- A Russian reader never sees the English words the page is written in: the title turns before the first
       paint and the translated texts stay hidden until the game's own script has put them in Russian. -->
  <script>
    (function () {
      var l = null;
      try { l = localStorage.getItem('gravetide.lang'); } catch (e) {}
      if (l !== 'en' && l !== 'ru') l = /^(ru|uk|be)/i.test(navigator.language || '') ? 'ru' : 'en';
      if (l === 'ru') {
        document.documentElement.lang = 'ru';
        document.documentElement.classList.add('i18n-pending');
        document.title = 'GRAVETIDE — пиратская готическая MMORPG';
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IM+Fell+English+SC&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <canvas id="world"></canvas>

  <!-- Title / login -->
  <section id="screen-login" class="screen">
    <div class="keyart" data-asset="art.keyart"></div>
    <div class="login-panel panel">
      <div class="row lang-switch" style="gap:6px;justify-content:flex-end">
        <button class="btn btn-small" type="button" data-lang="en" title="English">EN</button>
        <button class="btn btn-small" type="button" data-lang="ru" title="Русский">RU</button>
      </div>
      <h1 class="title">GRAVETIDE</h1>
      <p class="subtitle" data-i18n="login.subtitle">The ocean is the world. The ship is the character. The captain is the build.</p>
      <form id="login-form">
        <label><span data-i18n="login.name">Captain's name</span><input id="login-name" maxlength="20" autocomplete="off" placeholder="e.g. Anne Blackwood" data-i18n-ph="login.namePh" /></label>
        <button class="btn btn-primary" type="submit" data-i18n="login.guest">Set sail as a guest</button>
      </form>
      <details id="login-account" class="login-account">
        <summary data-i18n="login.account">Sign in with an account</summary>
        <form id="email-form">
          <label><span data-i18n="login.email">E-mail</span><input id="login-email" type="email" autocomplete="email" /></label>
          <label><span data-i18n="login.password">Password</span><input id="login-password" type="password" autocomplete="current-password" minlength="8" /></label>
          <label id="register-name-wrap" class="hidden"><span data-i18n="login.name">Captain's name</span><input id="register-name" maxlength="20" autocomplete="off" /></label>
          <div class="row" style="gap:6px;flex-wrap:wrap">
            <button class="btn btn-primary" type="submit" data-mode="login" data-i18n="login.signIn">Sign in</button>
            <button class="btn" type="button" id="register-toggle" data-i18n="login.newAccount">New account</button>
            <button class="btn btn-small" type="button" id="forgot-btn" data-i18n="login.forgot">Forgot password</button>
          </div>
        </form>
        <div id="oauth-buttons" class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap"></div>
      </details>
      <form id="reset-form" class="hidden">
        <label><span data-i18n="login.newPassword">New password</span><input id="reset-password" type="password" autocomplete="new-password" minlength="8" /></label>
        <button class="btn btn-primary" type="submit" data-i18n="login.setPassword">Set the new password</button>
      </form>
      <p id="login-error" class="error"></p>
      <p class="hint" data-i18n="login.hint">Top-down multiplayer prototype · Phase 1 build</p>
    </div>
  </section>

  <!-- Captain selection -->
  <section id="screen-captain" class="screen hidden">
    <div class="captain-wrap panel">
      <h2 class="title-sm" data-i18n="captain.choose">Choose your captain</h2>
      <div id="captain-list" class="captain-list"></div>
      <div id="captain-detail" class="captain-detail"></div>
    </div>
  </section>

  <!-- In-game HUD: mobile-first. Top row (unit frame, minimap), a top stack and a bottom stack that never overlap,
       touch controls in the bottom corners on phones and tablets. -->
  <section id="hud" class="hidden">
    <div id="hud-captain" class="unit-frame"></div>
    <div id="hud-map" class="minimap-frame">
      <canvas id="minimap" width="220" height="220"></canvas>
      <i class="mm-ring"></i>
      <div id="unread" class="unread hidden" title="Letters waiting — [Y]" data-i18n-title="hud.unread"></div>
    </div>
    <div id="hud-region"></div>
    <div id="hud-stack">
      <div id="hud-target" class="hud-block hidden"></div>
      <div id="hud-party" class="hidden"></div>
      <div id="hud-boss" class="hud-block hidden"></div>
      <div id="hud-watch" class="hud-block hidden"></div>
      <div id="hud-goals" class="hidden"></div>
      <div id="hud-dive" class="hud-block hidden"></div>
    </div>
    <div id="hud-ship" class="hud-block ship-panel"></div>
    <div id="hud-nav" class="hud-block"></div>
    <nav id="hud-menu" class="micro-menu"></nav>
    <div id="hud-bottom">
      <div id="hud-hint"></div>
      <div id="hud-prompt"></div>
      <button id="tc-context" class="tc-context hidden"><span></span></button>
      <div id="hud-combat" class="action-bar"></div>
    </div>
    <div id="board-fight" class="hidden"></div>
    <div id="captions"></div>
    <div id="banner"></div>
    <div id="touch">
      <div id="tc-stick"><i id="tc-course" class="hidden"></i><i id="tc-knob"></i></div>
      <div id="tc-sail" data-sail="0">
        <button id="tc-sail-up" class="tc-btn" aria-label="Sail up"><b>▲</b></button>
        <div class="tc-steps"><i></i><i></i><i></i><i></i></div>
        <button id="tc-sail-down" class="tc-btn" aria-label="Sail down"><b>▼</b></button>
      </div>
      <button id="tc-chasers" class="tc-btn tc-small hidden" aria-label="Chasers"><b>⇡</b></button>
      <button id="tc-dash" class="tc-btn tc-small" aria-label="Dash"><b>»</b><i class="tc-cd"></i></button>
      <button id="tc-mount" class="tc-btn tc-small hidden" aria-label="Deck mount"><b>✺</b></button>
      <button id="tc-port" class="tc-fire" aria-label="Port broadside"><b>◀</b></button>
      <button id="tc-starboard" class="tc-fire" aria-label="Starboard broadside"><b>▶</b></button>
      <button id="tc-menu" class="tc-btn tc-menu" aria-label="Menu"><b>☰</b></button>
    </div>
  </section>

  <!-- In the HUD's frame but over the windows: the server's word is seen in port too; the chat rises while open. -->
  <div id="hud-toasts" class="hud-layer hidden"><div id="toasts"></div></div>
  <div id="hud-chat" class="hud-layer hidden">
    <div id="chat">
      <div id="chat-tabs"></div>
      <div id="chat-log"></div>
      <input id="chat-input" maxlength="200" placeholder="Enter to speak…" data-i18n-ph="hud.chatPh" />
    </div>
  </div>

  <section id="modal" class="hidden">
    <div id="modal-panel" class="panel"></div>
  </section>

  <div id="prologue" class="hidden"></div>
  <div id="radial" class="hidden"></div>
  <div id="pad-cursor" class="hidden"></div>

  <div id="connection" class="hidden" data-i18n="conn.reconnecting">Reconnecting to the Admiralty…</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
